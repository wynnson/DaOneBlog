<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal | Da One Blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../assets/style.css">
</head>

<body class="home">
  <div class="scene">
   <div class="crt">
    <div class="crt-back"></div>
    <div class="crt-bezel">
     <div class="crt-recess">
      <main class="crt-screen">
        <div class="crt-content">
          <header class="site-header" data-boot data-pause>
            <div class="site-title term-title">Da One Blog</div>
            <div class="site-subtitle term-sub">&gt;&gt; written by Wynnson Zheng</div>
          </header>

          <div class="term-line" data-boot><span class="prompt"><span class="p-user">guest@wynnson</span>:<span class="p-path">~</span>$</span> cd personal &amp;&amp; ls</div>
          <h1 class="toc-title-big" data-boot>
            Personal
            <span class="toc-note"><small>(Life Stuff)</small></span>
          </h1>

          <!-- Add an entry per post. Put post files in this folder (personal/). -->
          <ul class="toc-list dir-list">
            <li><a href="ramblings/index.html">ramblings/</a><span class="date">Yapping</span></li>
          </ul>
          <ul class="toc-list">
          </ul>
          <div class="term-line empty-note">total 0</div>

          <div class="term-line" data-boot><span class="prompt"><span class="p-user">guest@wynnson</span>:<span class="p-path">~/personal</span>$</span> <a href="../index.html" class="nav-item" data-back>cd ..</a><span class="cursor"></span><span class="back-hint"><span class="hint-key">  # press ESC or click to go back</span><span class="hint-touch">  # tap to go back</span></span></div>
        </div>
      </main>
     </div>
      <div class="crt-label">DA-ONE 8000</div>
      <div class="crt-vents"></div>
      <div class="crt-led"></div>
      <button class="crt-power" type="button" aria-label="Power"></button>
      <aside class="sticky-note" aria-label="Keyboard tip">
        <b>TIP:</b>
        <p><kbd>&uarr;</kbd> <kbd>&darr;</kbd> to navigate</p>
        <p><kbd>ENTER</kbd> to open</p>
        <p><kbd>ESC</kbd> go back</p>
      </aside>
    </div>
    <div class="crt-stand"></div>
    <div class="crt-base"></div>
   </div>
  </div>

  <script src="../assets/terminal.js"></script>
</body>
</html>
